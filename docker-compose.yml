services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artifex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artifex}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artifex} -d ${POSTGRES_DB:-artifex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The app runs on the HOST network stack on purpose: deployments behind a
  # VPN/tunnel (Surfshark, Tailscale, corporate WireGuard…) have a reduced
  # path MTU that silently drops large packets and the ICMP feedback, so a
  # bridged container hangs on every TLS handshake while HTTP/80 still works.
  # On the host stack the container's TCP learns the path MTU like the host's.
  # Postgres is reached on loopback (published above); see ARTIFEX_PG_DSN.
  artifex:
    network_mode: host
    build:
      context: .
    image: artifex:local
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-addr"
      - "${ARTIFEX_BIND_ADDR:-:8787}"
      - "-proxy"
      - "${ARTIFEX_PROXY_ADDR:-:8788}"
    environment:
      ARTIFEX_LANGUAGE: ${ARTIFEX_LANGUAGE:-en}
      ARTIFEX_PG_DSN: postgres://${POSTGRES_USER:-artifex}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-artifex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTIFEX_LLM_PROVIDER: ${ARTIFEX_LLM_PROVIDER:-}
      ARTIFEX_LLM_MODEL: ${ARTIFEX_LLM_MODEL:-}
      ARTIFEX_LLM_BASE_URL: ${ARTIFEX_LLM_BASE_URL:-}
      ARTIFEX_LLM_PROXY: ${ARTIFEX_LLM_PROXY:-}
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
